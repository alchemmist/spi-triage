name: SPI service CI and release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Existing role to update; gateway target never replaces SPI workers
        type: choice
        required: true
        default: spi-triage
        options:
          - spi-triage
          - alert-graphs
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Backend and frontend regressions (local fixtures only)
        run: python3 scripts/test_all.py
      - name: PostgreSQL queue concurrency (disposable local database)
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createuser "$(id -un)"
          sudo -u postgres createdb -O "$(id -un)" spi_queue_test
          python3 -m venv "$RUNNER_TEMP/spi-pg-test"
          "$RUNNER_TEMP/spi-pg-test/bin/pip" install 'psycopg[binary]==3.2.13'
          SPI_TEST_PG_SOCKET=/var/run/postgresql "$RUNNER_TEMP/spi-pg-test/bin/python" tests/postgres/queue_read_concurrency.py
      - name: JavaScript syntax
        run: node --check frontend/app.js
      - name: Build native test image
        run: docker build --platform linux/amd64 --target test --tag spi-triage:test .
      - name: Offline native and integration regressions in production resource budget
        run: >-
          docker run --rm --network none --read-only --cpus 1
          --memory 384m --memory-swap 384m --pids-limit 256
          --tmpfs /tmp:rw,nosuid,nodev,size=64m
          -e SPI_REQUIRE_NATIVE_TESTS=true spi-triage:test
      - name: Build complete immutable release image (no publication)
        run: docker build --platform linux/amd64 --target release --tag spi-triage:checked .
  publish-and-deploy:
    concurrency:
      group: spi-triage-release
      cancel-in-progress: false
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_ENABLED == 'true'
    needs: test-and-build
    environment: spi-triage-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select a TLS-verified Harbor entrance for this ephemeral runner
        id: entrance
        shell: bash
        run: |
          set -euo pipefail
          host=harbor.socrat.alchemmist.xyz
          for ip in $(getent ahostsv4 "$host" | awk '$2=="STREAM" && !seen[$1]++ {print $1}'); do
            headers=$(mktemp)
            status=$(curl -sS --max-time 8 --resolve "$host:443:$ip" -D "$headers" -o /dev/null -w '%{http_code}' "https://$host/v2/") || continue
            if [[ "$status" == 401 ]] && grep -iq '^www-authenticate: Bearer ' "$headers"; then
              echo "$ip $host" | sudo tee -a /etc/hosts >/dev/null
              echo "ip=$ip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'No TLS-verified Harbor registry entrance returned the native challenge.' >&2
          exit 1
      - name: Verify scoped Harbor robot and prepare credentials
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: python3 scripts/harbor_ci_auth.py --repository homelab/spi-triage
      - name: Configure isolated Docker Buildx
        id: builder
        uses: docker/setup-buildx-action@v3
        with:
          # Per-builder TLS interoperability, not a host/daemon/DNS change.
          # Retain TLS1.3, certificate verification and native robot token auth.
          driver-opts: |
            env.GODEBUG=tlsmlkem=0

      - name: Route the isolated publisher through the same verified entrance
        env:
          BUILDER: ${{ steps.builder.outputs.name }}
          HARBOR_IP: ${{ steps.entrance.outputs.ip }}
        run: |
          printf '%s harbor.socrat.alchemmist.xyz\n' "$HARBOR_IP" | docker exec -i "buildx_buildkit_${BUILDER}0" sh -c 'cat >> /etc/hosts'
      - name: Build and push full-service image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          platforms: linux/amd64
          push: true
          tags: harbor.socrat.alchemmist.xyz/homelab/spi-triage:${{ github.sha }}
      - name: Deploy SPI service to Socrat
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'spi-triage'
        uses: alchemmist/deploy-to-socrat@v1
        with:
          app: spi-triage
          token: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          image_version: ${{ steps.image.outputs.digest }}

      - name: Deploy stateless graph gateway to Socrat
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'alert-graphs'
        uses: alchemmist/deploy-to-socrat@v1
        with:
          app: grafana
          component: gateway
          token: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          image_version: ${{ steps.image.outputs.digest }}

      - name: Remove ephemeral registry credentials
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib
          directory=pathlib.Path(os.environ.get('DOCKER_CONFIG','/nonexistent'))
          if directory.name.startswith('harbor-ci-auth-') and directory.parent==pathlib.Path(os.environ['RUNNER_TEMP']):
              (directory/'config.json').unlink(missing_ok=True)
          PY
